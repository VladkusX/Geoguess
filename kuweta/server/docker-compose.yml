services:
  kuweta:
    build: .
    container_name: kuweta
    restart: unless-stopped
    environment:
      # Kod, którym admin rejestruje swój telefon. Zmień na coś swojego!
      KUWETA_ADMIN_CODE: ${KUWETA_ADMIN_CODE:?ustaw KUWETA_ADMIN_CODE w pliku .env}
      KUWETA_TZ: Europe/Warsaw
    volumes:
      - ./data:/data
    ports:
      - "8787:8787"
