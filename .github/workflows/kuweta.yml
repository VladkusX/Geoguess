name: Kuweta Patrol

on:
  workflow_dispatch:
  push:
    paths:
      - 'kuweta/**'
      - '.github/workflows/kuweta.yml'

permissions:
  contents: write
  packages: write

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuweta/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests

  server-image:
    needs: server-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kuweta-server:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: kuweta/server
          push: true
          tags: ${{ steps.img.outputs.name }}
          platforms: linux/amd64,linux/arm64

  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuweta/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "kuweta-patrol-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: kuweta-patrol-apk
          path: kuweta/android/kuweta-patrol-*.apk
      - name: Release (link do pobrania na telefonie)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kuweta-${{ github.run_number }}
          name: Kuweta Patrol ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: kuweta/android/kuweta-patrol-*.apk
          body: |
            APK aplikacji Kuweta Patrol. Pobierz na telefonie i zainstaluj (zezwól na instalację z nieznanych źródeł).
